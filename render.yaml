services:
  - type: web
    name: teachfolio-staging
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SUPABASE_STORAGE_BUCKET
        value: teachfolio-evidence
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
